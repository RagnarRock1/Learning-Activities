<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Philosophy Hangman</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root {
    --paper: #F7F5EF;
    --paper-edge: #DFD8C4;
    --ink: #24211B;
    --ink-soft: #6B6455;
    --accent: #B23A2E;
    --accent-dark: #8C2E24;
    --good: #4C7A5E;
    --good-bg: rgba(76,122,94,0.14);
    --bad: #8C3B2E;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    margin: 0;
    min-height: 100%;
    background: #1E1B16;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
  }

  .wrap {
    max-width: 560px;
    margin: 0 auto;
    padding: 28px 16px 60px;
  }

  .masthead {
    text-align: center;
    margin-bottom: 18px;
  }

  .back-link {
    display: inline-block;
    color: rgba(247,245,239,0.55);
    font-size: 0.8rem;
    text-decoration: none;
    margin-bottom: 10px;
  }

  .back-link:hover {
    color: #F7F5EF;
  }

  .stamp {
    display: inline-block;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #1E1B16;
    background: var(--accent);
    padding: 3px 9px;
    border-radius: 3px;
    transform: rotate(-2deg);
    margin-bottom: 10px;
  }

  .masthead h1 {
    font-family: "Iowan Old Style", "Palatino Linotype", "Sitka Text", Georgia, serif;
    font-weight: 600;
    font-size: 1.5rem;
    color: #F7F5EF;
    margin: 0 0 4px;
  }

  .masthead p {
    color: rgba(247,245,239,0.6);
    font-size: 0.85rem;
    margin: 0;
  }

  .panel {
    background: var(--paper);
    border: 1px solid var(--paper-edge);
    border-radius: 14px;
    padding: 20px;
    box-shadow: 0 16px 36px rgba(0,0,0,0.3);
    margin-bottom: 16px;
  }

  label {
    display: block;
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--ink-soft);
    margin-bottom: 6px;
    letter-spacing: 0.02em;
    text-transform: uppercase;
  }

  input[type="text"] {
    width: 100%;
    font-family: inherit;
    font-size: 1rem;
    padding: 11px 13px;
    border-radius: 8px;
    border: 2px solid var(--paper-edge);
    background: #FBF9F3;
    margin-bottom: 14px;
  }

  input[type="text"]:focus {
    outline: none;
    border-color: var(--accent);
  }

  input[type="text"].code-input {
    text-transform: uppercase;
    letter-spacing: 0.15em;
    font-weight: 700;
    text-align: center;
  }

  button {
    font-family: inherit;
    font-size: 0.95rem;
    font-weight: 700;
    padding: 12px 18px;
    border-radius: 26px;
    border: none;
    cursor: pointer;
    width: 100%;
  }

  button.primary {
    background: var(--accent);
    color: #FBF9F3;
    margin-bottom: 10px;
  }

  button.primary:hover {
    background: var(--accent-dark);
  }

  button.primary:disabled {
    opacity: 0.45;
    cursor: default;
  }

  button.secondary {
    background: #EFE9D8;
    color: var(--ink);
  }

  .divider {
    text-align: center;
    color: var(--ink-soft);
    font-size: 0.8rem;
    margin: 6px 0 14px;
  }

  .error-box {
    background: rgba(140,59,46,0.12);
    color: var(--bad);
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 0.85rem;
    margin-bottom: 14px;
    display: none;
  }

  .error-box.show {
    display: block;
  }

  .screen-title {
    font-size: 1.15rem;
    font-weight: 800;
    margin: 0 0 14px;
  }

  .back-btn {
    background: none;
    border: none;
    color: var(--accent);
    font-weight: 800;
    padding: 0;
    margin-bottom: 12px;
    cursor: pointer;
    width: auto;
    font-size: 0.9rem;
  }

  .choice-card {
    display: block;
    width: 100%;
    text-align: left;
    background: #FBF9F3;
    border: 2px solid var(--paper-edge);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
    cursor: pointer;
  }

  .choice-card:hover:not(.disabled) {
    border-color: var(--accent);
  }

  .choice-card.disabled {
    opacity: 0.55;
    cursor: default;
    background: rgba(36,33,27,0.04);
  }

  .card-code {
    font-weight: 800;
    font-size: 1.05rem;
    color: var(--ink);
  }

  .card-title {
    color: var(--ink-soft);
    font-size: 0.92rem;
    margin-top: 4px;
  }

  .card-note {
    color: var(--bad);
    font-size: 0.75rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-top: 6px;
  }

  .topic-display {
    font-weight: 800;
    color: var(--accent);
    margin-bottom: 12px;
  }

  .topic-display.small {
    font-size: 0.85rem;
    color: var(--ink-soft);
    margin-bottom: 10px;
  }

  .room-code-display {
    text-align: center;
    margin-bottom: 16px;
  }

  .room-code-display .code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 2.1rem;
    font-weight: 700;
    letter-spacing: 0.18em;
    color: var(--accent);
  }

  .room-code-display .hint {
    font-size: 0.78rem;
    color: var(--ink-soft);
    margin-top: 4px;
  }

  .player-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 4px;
  }

  .player-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 13px;
    border-radius: 8px;
    background: rgba(36,33,27,0.04);
    font-size: 0.9rem;
  }

  .player-row.turn {
    background: rgba(178,58,46,0.12);
    border: 1px solid var(--accent);
  }

  .player-row.eliminated {
    opacity: 0.5;
  }

  .player-row .name {
    font-weight: 700;
  }

  .player-row .score {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: var(--ink-soft);
  }

  .player-row .badge {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 10px;
    background: var(--accent);
    color: #FBF9F3;
    margin-left: 8px;
  }

  .player-row .badge.out {
    background: var(--bad);
  }

  .clue-box {
    background: #F1EDDD;
    border: 2px dashed var(--paper-edge);
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 14px;
    font-size: 0.98rem;
  }

  .clue-row {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 14px;
  }

  .clue-tag {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    background: #EFE9D8;
    color: var(--ink);
    padding: 5px 11px;
    border-radius: 12px;
  }

  .masked-word {
    text-align: center;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    padding: 20px 10px;
    background: rgba(36,33,27,0.04);
    border-radius: 10px;
    margin-bottom: 16px;
    word-break: break-all;
  }

  .turn-banner {
    text-align: center;
    font-weight: 700;
    font-size: 0.95rem;
    padding: 10px;
    border-radius: 8px;
    margin-bottom: 14px;
    background: var(--good-bg);
    color: var(--good);
  }

  .turn-banner.waiting {
    background: rgba(36,33,27,0.05);
    color: var(--ink-soft);
  }

  .turn-banner.eliminated {
    background: rgba(140,59,46,0.1);
    color: var(--bad);
  }

  .keyboard {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
    margin-bottom: 16px;
  }

  .key {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-weight: 700;
    font-size: 0.85rem;
    padding: 10px 0;
    border-radius: 6px;
    border: 2px solid var(--paper-edge);
    background: #FBF9F3;
    color: var(--ink);
    cursor: pointer;
    width: auto;
  }

  .key:hover:not(:disabled) {
    border-color: var(--accent);
  }

  .key:disabled {
    opacity: 0.3;
    cursor: default;
  }

  .key.used-right {
    background: var(--good-bg);
    border-color: var(--good);
    color: var(--good);
  }

  .key.used-wrong {
    background: rgba(140,59,46,0.1);
    border-color: var(--bad);
    color: var(--bad);
  }

  .solve-row {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }

  .solve-row input {
    margin-bottom: 0;
    flex: 1;
  }

  .solve-row button {
    width: auto;
    padding: 11px 16px;
  }

  .round-over-banner {
    text-align: center;
    padding: 16px;
    border-radius: 10px;
    margin-bottom: 16px;
  }

  .round-over-banner.solved {
    background: var(--good-bg);
  }

  .round-over-banner.unsolved {
    background: rgba(140,59,46,0.1);
  }

  .round-over-banner .headline {
    font-weight: 700;
    font-size: 1.05rem;
    margin-bottom: 4px;
  }

  .round-over-banner .answer {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 1.2rem;
    font-weight: 700;
  }

  #screenCourses,
  #screenUnits,
  #screenJoin,
  #screenLobby,
  #screenWaiting,
  #screenGame {
    display: none;
  }

  #screenCourses.active,
  #screenUnits.active,
  #screenJoin.active,
  #screenLobby.active,
  #screenWaiting.active,
  #screenGame.active {
    display: block;
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="masthead">
    <a href="../index.html" class="back-link">&larr; Course Activities</a>
    <div><span class="stamp">Multiplayer</span></div>
    <h1>Philosophy Hangman</h1>
    <p>Study together, anywhere</p>
  </div>

  <div id="screenCourses">
    <div class="panel">
      <div class="error-box" id="courseError"></div>
      <h2 class="screen-title">Choose a Course</h2>
      <div id="courseList"></div>
      <button class="secondary" id="joinFromCoursesBtn">Join with a game code</button>
    </div>
  </div>

  <div id="screenUnits">
    <div class="panel">
      <button class="back-btn" id="backToCoursesBtn">&larr; Back to Courses</button>
      <div class="error-box" id="unitError"></div>
      <h2 class="screen-title" id="unitTitle"></h2>
      <div id="unitList"></div>
    </div>
  </div>

  <div id="screenJoin">
    <div class="panel">
      <button class="back-btn" id="backToCoursesFromJoinBtn">&larr; Back to Courses</button>
      <h2 class="screen-title">Join a Game</h2>
      <div class="error-box" id="joinError"></div>

      <label for="joinNameInput">Your name</label>
      <input type="text" id="joinNameInput" maxlength="20" placeholder="e.g. Jordan">

      <label for="joinCodeInput">Game code</label>
      <input type="text" id="joinCodeInput" class="code-input" maxlength="5" placeholder="ABCDE">

      <button class="primary" id="joinGameBtn">Join Game</button>
    </div>
  </div>

  <div id="screenLobby">
    <div class="panel">
      <button class="back-btn" id="backToUnitsBtn">&larr; Back to Units</button>
      <div class="topic-display" id="lobbyTopic"></div>
      <div class="error-box" id="lobbyError"></div>

      <label for="nameInput">Your name</label>
      <input type="text" id="nameInput" maxlength="20" placeholder="e.g. Jordan">

      <button class="primary" id="createBtn">Create a New Game</button>

      <div class="divider">or</div>

      <label for="codeInput">Game code</label>
      <input type="text" id="codeInput" class="code-input" maxlength="5" placeholder="ABCDE">

      <button class="secondary" id="joinBtn">Join Game</button>
    </div>
  </div>

  <div id="screenWaiting">
    <div class="panel">
      <div class="topic-display" id="waitingTopic"></div>

      <div class="room-code-display">
        <div class="code" id="waitingCode"></div>
        <div class="hint">Share this code, or send the link, with whoever you're playing with.</div>
      </div>

      <div class="player-list" id="waitingPlayerList"></div>
    </div>

    <button class="primary" id="startGameBtn">Start Game</button>
  </div>

  <div id="screenGame">
    <div class="panel" id="roundOverPanel" style="display:none;">
      <div class="round-over-banner" id="roundOverBanner">
        <div class="headline" id="roundOverHeadline"></div>
        <div class="answer" id="roundOverAnswer"></div>
      </div>

      <button class="primary" id="nextRoundBtn">Next Word</button>
    </div>

    <div class="panel" id="playPanel">
      <div class="topic-display small" id="gameTopic"></div>
      <div class="clue-box" id="clueBox"></div>

      <div class="clue-row">
        <span class="clue-tag" id="clueEra"></span>
        <span class="clue-tag" id="clueKind"></span>
      </div>

      <div class="masked-word" id="maskedWordDisplay"></div>
      <div class="turn-banner" id="turnBanner"></div>
      <div class="keyboard" id="keyboard"></div>

      <div class="solve-row">
        <input type="text" id="solveInput" placeholder="Type the whole word...">
        <button class="primary" id="solveBtn" style="width:auto;">Solve</button>
      </div>
    </div>

    <div class="panel">
      <div class="player-list" id="gamePlayerList"></div>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://psktfkynkbhxcvoewktk.supabase.co";
const SUPABASE_KEY = "sb_publishable_XNghtb8kNChIdG9Wg3sJ_g_PmLs2de4";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let myName = "";
let myPlayerId = null;
let myRoomId = null;

let currentRoom = null;
let currentPlayers = [];
let channel = null;

let courses = [];
let units = [];

let selectedCourseCode = null;
let selectedUnitSlug = null;
let selectedUnitTitle = null;

const screens = {
  courses: document.getElementById("screenCourses"),
  units: document.getElementById("screenUnits"),
  join: document.getElementById("screenJoin"),
  lobby: document.getElementById("screenLobby"),
  waiting: document.getElementById("screenWaiting"),
  game: document.getElementById("screenGame")
};

function showScreen(name) {
  Object.values(screens).forEach(s => s.classList.remove("active"));
  screens[name].classList.add("active");
}

function showError(id, msg) {
  const el = document.getElementById(id);
  el.textContent = msg;
  el.classList.add("show");
}

function clearError(id) {
  const el = document.getElementById(id);
  el.textContent = "";
  el.classList.remove("show");
}

function escapeHtml(s) {
  const d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}

async function loadCoursesAndUnits() {
  const [{ data: courseData, error: courseError }, { data: unitData, error: unitError }] = await Promise.all([
    sb.from("courses").select("*").eq("active", true).order("display_order", { ascending: true }),
    sb.from("units").select("*").eq("active", true).order("display_order", { ascending: true })
  ]);

  if (courseError) throw courseError;
  if (unitError) throw unitError;

  courses = courseData || [];
  units = unitData || [];
}

function renderCourses() {
  const list = document.getElementById("courseList");
  list.innerHTML = "";

  courses.forEach(course => {
    const courseUnits = units.filter(u => u.course_code === course.code && u.active);
    const playable = courseUnits.some(u => Number(u.word_count || 0) > 0);

    const card = document.createElement("button");
    card.className = "choice-card" + (playable ? "" : " disabled");

    card.innerHTML = `
      <div class="card-code">${escapeHtml(course.code)}</div>
      <div class="card-title">${escapeHtml(course.title)}</div>
      ${playable ? "" : '<div class="card-note">Coming soon</div>'}
    `;

    if (playable) {
      card.addEventListener("click", () => openUnits(course.code));
    }

    list.appendChild(card);
  });
}

function openUnits(courseCode) {
  const course = courses.find(c => c.code === courseCode);
  if (!course) return;

  document.getElementById("unitTitle").textContent = `${course.code} Units`;

  renderUnits(courseCode);
  clearError("unitError");
  showScreen("units");
}

function renderUnits(courseCode) {
  const list = document.getElementById("unitList");
  list.innerHTML = "";

  const courseUnits = units
    .filter(u => u.course_code === courseCode && u.active)
    .sort((a, b) => a.display_order - b.display_order);

  if (courseUnits.length === 0) {
    list.innerHTML = `
      <div class="choice-card disabled">
        <div class="card-code">Units coming soon</div>
      </div>
    `;
    return;
  }

  courseUnits.forEach(unit => {
    const playable = Number(unit.word_count || 0) > 0;

    const card = document.createElement("button");
    card.className = "choice
